# Projeto Xcode do CellStudio para iPhone (gerado com XcodeGen).
#   brew install xcodegen
#   cd ios && xcodegen        → cria ios/CellStudio.xcodeproj
# Abra no Xcode, escolha a sua Team em Signing & Capabilities e rode no iPhone.
name: CellStudio
options:
  bundleIdPrefix: local.diogoramos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  CellCore:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/CellCore
  CellStudio:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/CellStudio
        excludes:
          - Resources/**
      - path: ../Sources/CellStudio/Resources/robots.json
        buildPhase: resources
      - path: ../Sources/CellStudio/Resources/rails.json
        buildPhase: resources
      # ícones do DXQ lidos de Bundle.main…/dxq: copiar como pasta
      - path: ../Sources/CellStudio/Resources/dxq
        type: folder
        buildPhase: resources
    dependencies:
      - target: CellCore
    # commit do git dentro do app: a tela Download compara com o último commit do GitHub
    postBuildScripts:
      - name: Build info
        script: '"$SRCROOT/../tools/build-info.sh" > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/build-info.json"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.diogoramos.cellstudio
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 652PMPLMNF   # Diogo Santos (Personal Team)
