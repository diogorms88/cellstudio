//signal                            = RPCSignal,                                                      GeneratedByPB, Cyclic, VarType, DataType, ChangeTolerance, Unit,       ValueMin,     ValueMax
//-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
