// Special dynamic configuration for Ehtercat-Data:
// This only works in FU system and only with data from the array SV_yEcatDevice!
// %NAME% is the name of the device which is searched in SV_yEcatDevice. The search is a substring search, i.e. "%EncoderBox%" will find "EncoderBox1" and "EncoderBox2".
// One signal wis created dynamically at the initialisation of the control for each device which is found by the name search. This means, one line can lead to multiple signals in the configuration.
// The $ represents the position, where the array index of the SV_yEcatDevice-array is inserted.
// %DP% is a special code: The DP is not an Ethercat device, but its temperature data is stored in the first DA3x-device of the kinematic.
