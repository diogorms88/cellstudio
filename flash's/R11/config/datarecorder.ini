//Section Description:
//general DataRecord signal description
//here is defined which signals of the different funcion units should be recorded
//the key = signal name of each section must be unique, signal name can have up to 32 characters
//each function unit (BCU1, BCU2, RCU1, ...) can have up to 220 signals, max total signals of all FUs 512

//Signal:
//local Signalname for DataRecorder

//RPCSignal:
//Signalname in RPC.
//SV-Name for SVs or HW-Endpoints, DeviceName.SignalName for SW-Signals

//GeneratedByPB:
//0=Signal was created manually will not be changed or deleted by ProcessBuilder
//1=Signal was created by ProcessBuilder and may be changed or deleted by ProcessBuilder

//Cyclic:
//0=Signal will be sent from RPC when requested by DataRecorder
//1=Signal will be sent cyclic from RPC

//Values VarType:
//0=nSwVarAct
//1=nSvVar
//2=nSwVarInterlocksIn
//3=nSwVarReleasesOut
//4=nSwVarOverrides
//5=nSwVarDDrIn

//Values DataType:
//BOOL, INT, DINT, UDINT, REAL, WORD, DWORD

//ChangeTolerance:
//new values are only recorded if difference from previous value is greater than change tolerance
//influences recorded data amount significantly

//Unit, ValueMin, ValueMax:
//This information is used for Visual Analytics (graphical view of time series in diagram)

