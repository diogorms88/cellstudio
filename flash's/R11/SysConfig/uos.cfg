[UOS]
systemTraceBufferSize	= 8192
systemTraceEventMask	= 2147483643

[UOS.INITKERNEL]
tickTime			= 1000        // Timerinterval [µs]
lHdlPoolSize		= 100000      // Number of locale handles
gHdlPoolSize		= 35000       // Number of global handles
textTableSize		= 10000       // Number of text-entries
stackSizeIntr		= 10240       // Stacksize of the interrupt-task [byte]

[UOS.CMDLINE]
portNr			= 4000
stackSize		= 10000
disable         = 0

[UOS.RPCSERVER]
taskPrior		= 16
stackSize		= 20000
