[global]
PrewarnTime       =  5,+,0d0h0m0s200ms,R,0d0h0m0s0ms,0d0h0m1s0ms   ;prewarn time
SimulateMaterial  =  0,+,0,R,0,1                                   ;operate process without material (winmod, pre-commissioning)

[global/Conveyor]
ConveyorBusType   =  1,*,6,R,1,8     ;Counter value is read from: 1=ProfiBus-IO, 6=Sercos3-IO, 8=Fieldbus-PLC
ConveyorExisting  =  0,#,0,R,0,1     ;Conveyor hardware: 0 - simulated; 1 - existing
PlcVendor         =  1,*,27,R,1,27   ;Vendor of PLC: 1=Siemens, 27=Rockwell

[global/Conveyor/CONV_COUNTER/AConveyor]
Conv_Acc_max      =  3,-,750.0,R,0.0,20000.0     ;Conveyor: Maximum acceleration
Conv_Puls_per_mm  =  3,-,1018.94,R,0.0,20000.0   ;Conveyor: Pulses per mm
Conv_Vel_max      =  3,-,400.0,R,0.0,100000.0    ;Conveyor: Maximum velocity

[global/Conveyorsimulation]
Acceleration   =  3,+,60.0,R,0.0,200.0       ;Acceleration simulated Conveyor in mm/sec2
ConveyorSpeed  =  3,+,3000.0,R,0.0,12000.0   ;Speed simulated Conveyor in mm/min
Deceleration   =  3,+,60.0,R,0.0,200.0       ;Deceleration simulated Conveyor in mm/sec2

[global/EmergencyStop]
WiredToBusmasterIO  =  0,*,0,R,0,1   ;0=estop signal from plc, 1=estop signal from busmaster

[global/FieldbusSimulationSystem]
Enabled  =  0,*,0,R,0,1   ;0=disabled, 1=enabled (e.g. WinMOD)

[global/FireAlarm]
CO2_SupplyType  =  1,*,0,R,0,1   ;0 - OR-Element; 1 - Y-Hose

[global/MsgSystem]
ShowEcatMsgOnHMI  =  0,*,1,R,0,1   ;show firmware messages for ethercat devices shown on hmi

[global/MsgSystem/AutoStarep]
EnableStarep01  =  0,+,0,R,0,1              ;enable writing starep after message
EnableStarep02  =  0,+,0,R,0,1              ;enable writing starep after message
EnableStarep03  =  0,+,0,R,0,1              ;enable writing starep after message
EnableStarep04  =  0,+,0,R,0,1              ;enable writing starep after message
EnableStarep05  =  0,+,0,R,0,1              ;enable writing starep after message
MsgForStarep01  =  4,+,"MsgComp_MsgNr",,,   ;replace value with MessageComponent_MessageNumber
MsgForStarep02  =  4,+,"MsgComp_MsgNr",,,   ;replace value with MessageComponent_MessageNumber
MsgForStarep03  =  4,+,"MsgComp_MsgNr",,,   ;replace value with MessageComponent_MessageNumber
MsgForStarep04  =  4,+,"MsgComp_MsgNr",,,   ;replace value with MessageComponent_MessageNumber
MsgForStarep05  =  4,+,"MsgComp_MsgNr",,,   ;replace value with MessageComponent_MessageNumber

[global/MsgSystem/AutoStarepSercos]
EnableStarep01  =  0,+,1,R,0,1           ;enable writing starep after message
EnableStarep02  =  0,+,0,R,0,1           ;enable writing starep after message
EnableStarep03  =  0,+,0,R,0,1           ;enable writing starep after message
EnableStarep04  =  0,+,0,R,0,1           ;enable writing starep after message
EnableStarep05  =  0,+,0,R,0,1           ;enable writing starep after message
MsgForStarep01  =  4,+,"F8021",,,        ;replace value with sercos errorcode
MsgForStarep02  =  4,+,"ErrorCode2",,,   ;replace value with sercos errorcode
MsgForStarep03  =  4,+,"ErrorCode3",,,   ;replace value with sercos errorcode
MsgForStarep04  =  4,+,"ErrorCode4",,,   ;replace value with sercos errorcode
MsgForStarep05  =  4,+,"ErrorCode5",,,   ;replace value with sercos errorcode

[global/MsgSystem/Suppression]
MaskMotionErrors       =  0,*,0,R,0,1   ;suppress messages from TeachControl if robot is deselected
MaskProcessErrors      =  0,*,0,R,0,1   ;suppress messages from PCU if atomizer is deselected
NumberOfInfosOnHMI     =  1,+,3,R,0,6   ;Number of simultaneous infos on HMI
NumberOfWarningsOnHMI  =  1,+,6,R,0,6   ;Number of simultaneous warnings on HMI
SuppressMessages       =  0,+,1,R,0,1   ;enable suppression of messages on hmi

[global/RCMP]
Check24VEP                =  0,*,0,R,0,1                                  ;Monitor 24V power supply for emergency purge 0 - disabled; 1 - enabled
CheckCoolingDevice        =  0,+,0,R,0,1                                  ;cooling device check: 0 - disabled; 1 - enabled
CheckUPS                  =  0,+,1,R,0,1                                  ;UPS: 0 - disabled; 1 - enabled
DelayCoolingError         =  5,+,0d0h30m0s0ms,R,0d0h0m0s0ms,0d2h0m0s0ms   ;delay time cooling device error
EnableCoolingDeviceError  =  0,+,0,R,0,1                                  ;cooling device error: 0 - disabled; 1 - enabled
EnableTimeCounter         =  0,+,0,R,0,1                                  ;0/1  elapsed-time counter: Off / On
UseUpsSignalCapacitorOk   =  0,+,0,R,0,1                                  ;UPS: 0 - only signal 24V OK; 1 - signal UPS 24V and capacitor OK

[global/RCMP/FuseMonitoring]
Fuse01_ExCtrl      =  0,*,0,R,0,1                         ;dont set error message if excontroller dropped
Fuse01_HWEndpoint  =  4,*,system.HWI_mFMon24VUPS,,,       ;name of hardware endpoint in eplan
Fuse01_Name        =  4,*,F72,,,                          ;name of the fuse in cabinet, used for error message
Fuse02_ExCtrl      =  0,*,0,R,0,1                         ;dont set error message if excontroller dropped
Fuse02_HWEndpoint  =  4,*,system.HWI_mFMon24V,,,          ;name of hardware endpoint in eplan
Fuse02_Name        =  4,*,F73,,,                          ;name of the fuse in cabinet, used for error message
Fuse03_ExCtrl      =  0,*,0,R,0,1                         ;dont set error message if excontroller dropped
Fuse03_HWEndpoint  =  4,*,system.HWI_mFMon24VProcess,,,   ;name of hardware endpoint in eplan
Fuse03_Name        =  4,*,F74,,,                          ;name of the fuse in cabinet, used for error message
Fuse04_ExCtrl      =  0,*,0,R,0,1                         ;dont set error message if excontroller dropped
Fuse04_HWEndpoint  =  4,*,system.HWI_mFMon3P,,,           ;name of hardware endpoint in eplan
Fuse04_Name        =  4,*,Q0ANT/Q0DP/Q0TC,,,              ;name of the fuse in cabinet, used for error message

[global/S3]
MinBrakeVoltage  =  3,-,8.05,R,7.67,8.5   ;min voltage on motor brake
