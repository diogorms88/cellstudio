
[MasterBackup]
UserDataRestoreList = application\control\BCU?\*\*.*,application\control\PCU?\*\*.*,application\control\teachcontrol\kin?\*\*.*


;**********************************************************************
; Only one BCU exists per EcoRPC.
;**********************************************************************
