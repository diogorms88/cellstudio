ScalingFactor_Y      =  0.01    //   mm
ScalingFactor_Z      =  0.01    //   mm
ScalingFactor_A      =  0.001   //   deg
ScalingFactor_B      =  0.001   //   deg
ScalingFactor_C      =  0.001   //   deg
