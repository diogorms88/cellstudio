UseInterfaceInSim         = 0       //   1 = correction values are taken from the TeachView interface normally used in combination with "simulatePLC = 1" 
UseEStopVisionSystem      = 0       //   Visionsystem sends EStop signal used for door angle observation 0=Not used, 1=Active

[RC.KINEMATIC:0.Vision.Absolute]                                                                          
