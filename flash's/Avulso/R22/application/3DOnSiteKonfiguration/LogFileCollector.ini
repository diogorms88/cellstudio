;----------------------------------------------------------------------------------------
;   LogFileCollector.ini for RPC
;----------------------------------------------------------------------------------------
[Common]
Dest = E:\Backup\3DOnSite\LogFileCollector\%RPC_NAME%\LogFileCollector_%STATION_NAME%_%RPC_NAME_SIMPLE%_%DATE%_%TIME%.7z

[Step1]
Source = \\%IP_RPC%\masterdisk\protocol\log\*.*

[Step2]
Source = \\%IP_RPC%\appldisk\application\*.*

[Step3]
Source = \\%IP_RPC%\masterdisk\protocol\protocol\*.*

[Step4]
Source = \\%IP_RPC%\masterdisk\protocol\statistic\*.*

[Step5]
Source = \\%IP_RPC%\masterdisk\protocol\tmp\viewserver\*.*

[Step6]
Source     = \\%IP_RPC%\masterdisk\protocol\statusreport\*.*
Indexfile  = \\%IP_RPC%\masterdisk\protocol\statusreport\lastStaRep.txt
NoOfFiles  = 2
MaxIndex   = 0

[Step7]
Source = E:\Log\PLC_EventLogger\*.*

[Step8]
Source = \\%IP_RPC%\masterdisk\protocol\pipeserver\*.*

[Step9]
Source = \\%IP_RPC%\masterdisk\protocol\crashreport\*.*

;----------------------------------------------------------------------------------------
;   The configuration of <Alarms> depends on the application number of the visualisation
;   and has to be customized -- check directories
;----------------------------------------------------------------------------------------
[Alarms]
Enabled            = 1
PLCGlobalErrorFile = "D:\Eco_Scr\DB\DB_global\language\Global_Error.csv"
PLCAppErrorFile    = "D:\Eco_Scr\DB\DB_RobApp01\global\language\LANG_Err.csv"
LastXHours         = 2
