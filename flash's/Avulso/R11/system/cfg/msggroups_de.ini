//Messages to PLC-Configuration file. Maximum 39 groups (00-38)allowed! Group 39 is fix for all other errors!
//Maximum 10 Errors/groups allowed!
//RPC Error format "xxxxR11xxxx Text"
//Axx = errors and warnings will be shown
//Exx = only errors will be shown
//Wxx = only warnings will be shown
//*   = is replaced with the Kinematic-Name: R12 - A02 = 0365* ==> 0365R12 must be in the message string
//All keywords (comma separated) must be included in the errorstring to HMI: A02 = 0365R,0025 ==> "0365R" AND "0025" must be in the message string. All characters are considered, incl. spaces.

[00_Profinet-Busfehler]
A01 = Profinet
A02 = 0402*   //Kommunikation/Name von EthernetIP fehlerhaft

[01_Sercos-Busfehler]
E01 = Sercos
E02 = 0497* //Fehler Sercosparametrierung
E03 = 0496*

[02_EtherCat-Busfehler]
E01 = 0490*
E02 = 0491*
E03 = EtherCat

[03_Steuerungsinterne Fehler]
E01 = 0498*

[04_Fehler Karossendatenhandling]
E01 = 0017*  //Body-ID außer Bereich
E02 = 0020*  //Body-ID bereits vorhanden
A03 = 0022*  //nicht in Typzuordnung parametriert
E04 = BodyInPosition //en, da fester Ausdruck

[05_Leistungsschrank Temperatur]
A01 = 0365*,0024  

[06_Leistungsschrank Sicherungsfall]
A01 = Sicherung

[07_SPS-Freigabe fehlt]
A01 = 0518*,0019  //Keine Bewegungsfreigabe von SPS
A02 = 0006*       //Fixpositionsanforderung und keine Freigabe von SPS
A03 = 0013*

[08_Fehler Versorung 24V]
A01 = 0365*,0003  //Sicherung 24V Versorgung

[09_Fehler Druckluftversorgung]
