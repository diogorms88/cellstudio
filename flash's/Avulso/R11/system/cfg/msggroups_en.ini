//Messages to PLC-Configuration file. Maximum 39 groups (00-38)allowed! Group 39 is fix for all other errors!
//Maximum 10 Errors/groups allowed!
//RPC Error format "xxxxR11xxxx Text"
//Axx = errors and warnings will be shown
//Exx = only errors will be shown
//Wxx = only warnings will be shown
//*   = is replaced with the Kinematic-Name: R12 - A02 = 0365* ==> 0365R12 must be in the message string
//All keywords (comma separated) must be included in the errorstring to HMI: A02 = 0365R,0025 ==> "0365R" AND "0025" must be in the message string. All characters are considered, incl. spaces.

[00_Error_BodyDataHandling]
E01 = 0013*  //AB_InterfaceToMotion, Program start related errors
E02 = 0017*  //%4Body ID out of range: %1
E03 = 0022*  //body data related errors, valve nr out of range
E04 = 0042*  //%4Error timeout reinitializing body data 
A05 = 0043*  //body data parameters out of range
A06 = 0100*  //body fifo related errors
E07 = 0124*  //body ID fatal errors

[01_Error_Process]
A01 = 0079*  //Process interlocks errors
E02 = 0117*  //statistics related errors
E03 = 0121*  //trigger brush related errors
A04 = 0130*  //time programs related errors
A05 = 0499*  //time program timeouts

[02_Error_EtherCat_Encoder]
E01 = 0490*   //Ethercat
E02 = 0491*   //Encoder
E03 = EtherCat,Encoder

[03_Error_Sercos]
A01 = 0496*  //sercos bus related errors

[04_Error_RCMP]
A01 = 0365*  // all RCMP faults like cooling device, fuses etc.
A02 = Battery,fuse

[05_Error_Fatal_Heartbeat]
A01 = 0366*      //Fatal error
A02 = 0371*      //FB_Init
A03 = 0088*,0001 //%4Heartbeat to TeachControl missing or response time limit exceeded
A04 = 0088*,0003 //%4Heartbeat to visualisation system failed.
A05 = 0088*,0004 //%4Heartbeat to PLC controller missing or response time limit exceeded
A06 = 0201*,0001 //%4SCU - %1 no heartbeat from RPC 
A07 = 0220*,0007 //%4No heartbeat from SCP 
A08 = 0220*,0008 //%4SCP: No Heartbeat from PLC
 
[06_Error_SCP]
A01 = 0220*      //SCP related errors
A02 = 0497*,0009 //%4Device %1 supports %2 function but neither SCP_Sync nor Watchdog is configured.
A03 = 0521*,0004 //%4Maximum allowed downtime of RPC controller expired, synchronisation of safety controller (SCP) requested.
A04 = 0521*,0013 //%4Waiting for interface information of the safety control (SCP). 
A05 = 0518*,0019 // No motion enable from PLC
A06 = 0521*      //RCU-SCP faults

[07_Error_Wire_Break]
A01 = cable,wire // wire break and cable break

[08_error compressed air supply]
A01 = 0079*,0007  //%4%1 is on but there is no pressure at the initiator %2.

[09_Motion_WorkspaceViolation_Drive]
E01 = 0517*,0033  //%4Violation of the working space when jogging (%1)
A02 = 0517*       //jogging related errors
A03 = 0513*       //drive related errors
A04 = 0524*,0009  //%4Failed to switch on drive %1 because not mastered.
E05 = 0524*,0010  //%4Start drive not possible. Timeout for brake check.
E06 = 0524*,0011  //%4Brake release device inserted 
E07 = 0524*,0027  //%4Can not switch on robot drives because safety controller is not referenced.
E08 = 0524*,0028  //%4Robot could not be mastered, because encoder box is in state error.
E09 = 0572*       //Brake check
A10 = 0573*       //brake check drive

[10_Motion_RCU_AutoControl_Handler]
A01 = 0534*  //RCU auto control project related errors
A02 = 0541*  //handler tool
A03 = 0542*  //part switch

[11_Motion_Teach_error]
E01 = 0518*  //kinematic errors

