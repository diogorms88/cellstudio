
[global/CheckData]
RobotType               = 1,-,0,R,0,3   ;0=Paintrobot / 1=Handler / 2=EMU / 3=PaintChecker
WatchingReleaseAtomizer = 1,*,1,R,0,2   ;WatchingReleaseAtomizer: 0 - OFF; 1 - error for only first body; 2 - error for each body

[global/Conveyor]
EnableConveyorStopPosition = 0,+,0,R,0,1                 ; conveyor stop position: 0 - disable; 1 - enable
MinRunSpeed                = 3,*,500.0,R,100.0,12000.0   ;minimal Conveyor Speed in mm/min for detect conveyor running

[global/PartDetect]
EnablePartDetect = 0,-,0,R,0,1                      ;Part Detect: 0 - not available; 1 -  from Station PLC
PartDetectPos    = 3,+,-1400.0,R,-10000.0,20000.0   ;PartDetect Position in mm
PartDetectWindow = 3,+,300.0,R,0.0,20000.0          ;PartDetect Window in mm

[global/ProgramStart]
ProgStartPos    = 3,+,0.0,R,-10000.0,20000.0   ;Programstartposition in mm
StartProgBodyIn = 0,*,0,R,0,1                  ;Start motion program with inlet of body in stop and go: 0 - start with body in position; 1 - start with inlet of body

[global/StationData]
DisableHomeStart      = 0,-,0,R,0,1                 ;Start program from: 0 - only from Homepos; 1 - any position
EnableReInitBodyData  = 0,-,1,R,0,1                 ;ReInitialisation Bodydata: 0 - disabled; 1 - enabled
RobotOffset           = 3,+,0.0,R,0.0,100000.0      ;Distance to MainRobot of station in mm
SkidLength            = 3,+,100.0,R,0.0,10000.0     ;Skid length in mm
StopAndGoMode         = 0,-,1,R,0,1                 ;Conveyormode: 0 - Tracking / 1 - Stop and Go
TimeoutMotionRel      = 3,+,5.0,R,0.0,20.0          ;timeout for motion release RPC in sec
TimeoutProgNumber     = 3,+,5.0,R,0.0,20.0          ;time for runtimecheck set programnumber to motion in sec
TimeoutReInitBodyData = 3,+,20.0,R,0.0,20.0         ;timeout for ReInitialisation Bodydata RPC in sec
TrackingEndPosition   = 3,+,10000.0,R,0.0,50000.0   ;Endposition Marshalling in mm

[global/T2Process]
Enable = 0,*,1,R,0,1     ;enable T2 with process
Type   = 1,+,1,R,0,100   ;type for virtual body
